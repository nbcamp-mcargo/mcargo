      test: ["CMD-SHELL", "pg_isready -U hubdb"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  hub-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: hub-service
    image: mcargo/hub-service:local
    container_name: hub-service
    depends_on:
      hub-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "19094:19094"
    restart: unless-stopped


  # ======================================================================
  # ORDER SERVICE + DB
  # ======================================================================
  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: orderdb
