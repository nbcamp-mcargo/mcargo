      test: ["CMD-SHELL", "pg_isready -U deliverydb"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: delivery-service
    image: mcargo/delivery-service:local
    container_name: delivery-service
    depends_on:
      delivery-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "19097:19097"
    restart: unless-stopped


  # ======================================================================
  # HUB SERVICE + DB
  # ======================================================================
