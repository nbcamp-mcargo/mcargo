services:

  # ======================================================================
  # EUREKA SERVER
  # ======================================================================
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: eureka-server
    image: mcargo/eureka-server:local
    container_name: eureka-server
    ports:
      - "19090:19090"
    restart: unless-stopped


  # ======================================================================
  # GATEWAY
  # ======================================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    image: mcargo/gateway:local
    container_name: gateway
    depends_on:
      - eureka-server
    ports:
      - "19091:19091"
    restart: unless-stopped


  # ======================================================================
  # AUTH SERVICE + DB
  # ======================================================================
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authdb
      POSTGRES_PASSWORD: authpassword
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authdb"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    image: mcargo/auth-service:local
    container_name: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "19096:19096"
    restart: unless-stopped


  # ======================================================================
  # DELIVERY SERVICE + DB
  # ======================================================================
  delivery-db:
    image: postgres:16-alpine
    container_name: delivery-db
    environment:
      POSTGRES_DB: deliverydb
      POSTGRES_USER: deliverydb
      POSTGRES_PASSWORD: deliverypassword
