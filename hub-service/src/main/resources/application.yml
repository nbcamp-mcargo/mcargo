spring:
  application:
    name: hub-service
  config:
    import: optional:file:.env-hub[.properties]

  datasource:
    url: ${HUD_URL}
    username: ${HUB_USER}
    password: ${HUB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 19094

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

kakao:
  rest-api-key: ${KAKAO_API_KEY}
