spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/delivery/**

        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/hub/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order/**

        - id: user-service
          uri: lb://user-service
            - Path=/user/**

      discovery:
        locator:
          enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

server:
  port: 19091