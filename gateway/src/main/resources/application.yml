spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:file:.env[.properties]
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**

        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/deliveries/**

        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/hubs/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auths/**
          filters:
            - StripPrefix=0
      default-filters:
        - PreserveHostHeader
    discovery:
      locator:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

server:
  port: 19091

service:
  jwt:
    secret-key: ${JWT_KEY}