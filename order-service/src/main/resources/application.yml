spring:
  application:
    name: order-service
  config:
    import: optional:file:.env-order[.properties]

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password :  ${ORDER_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/