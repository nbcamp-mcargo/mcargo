plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mcargo'
version = '0.0.1-SNAPSHOT'
description = 'slack-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2024.0.2")
}

dependencies {
    implementation 'com.slack.api:slack-api-client:1.7.0' // slack api
    implementation 'org.springframework.boot:spring-boot-starter-webflux' // webclient
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client' // 유레카 클라이언트
    implementation 'org.springframework.boot:spring-boot-starter-web' // 스프링 웹
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign' // feign
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // jpa
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation project(':common') // 공통 모듈
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
